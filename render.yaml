# Despliegue del prototipo en Render (plan gratis): un servicio web con la API
# de NestJS y la PWA compilada, y una base PostgreSQL dedicada a la demo.
# En Render: New → Blueprint → este repositorio.
services:
  - type: web
    name: fogon-andino
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # En producción la API solo reinicia los datos de la demo con este secreto
      # (cabecera x-reset-token). Render lo genera; se ve en Environment.
      - key: NODE_ENV
        value: production
      - key: RESET_TOKEN
        generateValue: true
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: fogon-andino-db
          property: connectionString

databases:
  - name: fogon-andino-db
    plan: free
    region: virginia
    databaseName: fogon
    user: fogon
    postgresMajorVersion: "17"
    # Solo el servicio web de Render puede conectarse; nada desde internet.
    ipAllowList: []
